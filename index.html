<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kitchen Service</title>
<meta name="theme-color" content="#1B2420" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" href="./icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kitchen Service" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  [data-theme="light"] { --ink:#1B2420; --paper:#F1F0EA; --steel:#5B6470; --steel-dark:#3A4149; --line:#D8D5C9; --card:#ffffff; }
  [data-theme="dark"]  { --ink:#EDEAE0; --paper:#141815; --steel:#8B9187; --steel-dark:#D6D9D1; --line:#33392F; --card:#1D2320; }
  ::selection { background: #D9A441; color: #1B2420; }
  input:focus, select:focus, textarea:focus { border-color: var(--ink) !important; }
  #boot-fallback { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5B6470; padding: 24px; text-align: center; }

  /* ---- minimal utility CSS (stand-in for Tailwind, kept local
     so nothing depends on an external CSS CDN) ---- */
  .flex { display: flex; }
  .grid { display: grid; }
  .flex-col { flex-direction: column; }
  .flex-1 { flex: 1 1 0%; }
  .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; }
  .items-end { align-items: flex-end; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .shrink-0 { flex-shrink: 0; }
  .relative { position: relative; }
  .sticky { position: sticky; }
  .top-0 { top: 0; }
  .z-20 { z-index: 20; }
  .w-full { width: 100%; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .max-w-6xl { max-width: 72rem; }
  .overflow-x-auto { overflow-x: auto; }
  .select-none { user-select: none; }
  .text-center { text-align: center; }
  .text-left { text-align: left; }
  .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gap-1 { gap: 0.25rem; } .gap-1\.5 { gap: 0.375rem; } .gap-2 { gap: 0.5rem; }
  .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; } .gap-5 { gap: 1.25rem; } .gap-6 { gap: 1.5rem; }
  .mb-1 { margin-bottom: 0.25rem; } .mb-3 { margin-bottom: 0.75rem; }
  .mt-3 { margin-top: 0.75rem; } .mt-4 { margin-top: 1rem; } .mt-5 { margin-top: 1.25rem; }
  .pt-4 { padding-top: 1rem; } .pt-5 { padding-top: 1.25rem; }
  .pb-1 { padding-bottom: 0.25rem; } .pb-3 { padding-bottom: 0.75rem; } .pb-10 { padding-bottom: 2.5rem; }
  .px-4 { padding-left: 1rem; padding-right: 1rem; }
  .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
  .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
  .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
  .py-14 { padding-top: 3.5rem; padding-bottom: 3.5rem; }
  .-mb-px { margin-bottom: -1px; }
  .min-w-\[120px\] { min-width: 120px; }
  .min-w-\[140px\] { min-width: 140px; }
  .min-w-\[180px\] { min-width: 180px; }
  @media (min-width: 768px) {
    .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .md\:grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .md\:px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
  }

  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"><div id="boot-fallback">ലോഡ് ചെയ്യുന്നു…</div></div>

<!-- XLSX is only needed when the Excel-download button is pressed; loaded
     in the background and non-blocking, so the app still works fully
     (Members, Attendance, Stock, etc.) even if this one script is slow
     or blocked on a given network. -->
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" defer crossorigin></script>

<!-- Everything else — React, ReactDOM, and the whole app — is bundled
     into this single local file. No CDN calls needed for the app to load. -->
<script src="./bundle.js"></script>
</body>
</html>
