<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="50,000 ആളുകൾക്കുള്ള Central Kitchen Management System">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Kitchen Service Pro</title>
<style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f5f7f7;--card:#fff;--text:#172024;--muted:#66747a;--line:#dce5e5;--danger:#b42318;--warn:#a15c00;--ok:#067647;--shadow:0 2px 12px #00000012}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Malayalam",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:var(--p);color:white;padding:12px 14px;box-shadow:0 2px 8px #0003}.toprow{display:flex;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800;flex:1}.small{font-size:12px;color:#d5eeee}.wrap{max-width:1200px;margin:auto;padding:12px 12px 80px}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:60px;z-index:10;background:var(--bg)}.nav button{white-space:nowrap;padding:9px 12px;border-radius:10px;background:#e6eeee;color:#174545}.nav button.active{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.kpi{font-size:25px;font-weight:800;margin-top:4px}.muted{color:var(--muted);font-size:13px}.good{color:var(--ok)}.bad{color:var(--danger)}.warn{color:var(--warn)}h2{margin:6px 0 14px}h3{margin:4px 0 10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.field textarea{min-height:80px}.full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.btn{padding:10px 13px;border-radius:9px;background:var(--p);color:#fff;font-weight:700}.btn.secondary{background:#e8eeee;color:#174545}.btn.danger{background:#b42318}.btn.warn{background:#a15c00}.btn:disabled{opacity:.45;cursor:not-allowed}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f0f5f5}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e8eeee;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#e7f5f3,#f8fbfb)}.loginbox{max-width:420px;width:100%;background:#fff;padding:24px;border-radius:20px;box-shadow:0 8px 35px #0002}.logo{width:68px;height:68px;border-radius:18px;background:var(--p);display:grid;place-items:center;color:#fff;font-size:34px;margin-bottom:10px}.empty{padding:25px;text-align:center;color:var(--muted)}.alert{padding:10px;border-radius:10px;background:#fff4df;margin-bottom:10px}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}.top{padding-top:10px}.nav{top:56px}.wrap{padding-left:9px;padding-right:9px}}

/* Smooth mobile UX */
html{scroll-behavior:smooth}body{padding-bottom:72px;-webkit-tap-highlight-color:transparent}.top{position:sticky;top:0}.toprow{min-height:40px}.brand{font-size:18px}.wrap{padding-top:6px}.nav{position:sticky;top:60px;z-index:15;padding:8px 0;gap:6px;background:var(--bg);border-bottom:1px solid #e6eeee}.nav button{font-size:13px;padding:8px 11px;border-radius:20px}.nav button.active{box-shadow:0 2px 8px #0f766e33}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0}.quick button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--shadow);color:var(--text);font-weight:700}.quick button span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}.card{transition:transform .12s ease,box-shadow .12s ease}.btn{min-height:42px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #00000012}.bottom button{background:transparent;color:#647277;padding:5px 2px;border-radius:10px;font-size:11px}.bottom button b{display:block;font-size:19px;line-height:20px}.bottom button.active{color:var(--p);background:#eaf6f4}.moremenu{position:fixed;left:8px;right:8px;bottom:72px;z-index:49;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 8px 30px #0003;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:65vh;overflow:auto}.moremenu button{padding:10px 5px;border:1px solid var(--line);border-radius:10px;background:#f8fbfb;color:#174545;font-size:12px}.moremenu button.active{background:var(--p);color:white}.sectiontitle{font-size:13px;font-weight:800;color:var(--muted);margin:15px 2px 7px;text-transform:uppercase;letter-spacing:.4px}@media(min-width:900px){body{padding-bottom:0}.bottom{display:none}.moremenu{display:none}.quick{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="kitchen_service_pro_v4";
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>new Date().toISOString();
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const timeNow=()=>new Date().toTimeString().slice(0,5);
const defaultState=()=>({
  user:null, date:today(),
  settings:{capacity:50000, currency:"INR"},
  members:[], departments:["Kitchen","Store","Production","Cleaning","Transport","Office"],
  meals:{}, menu:[], recipes:[], rawMaterials:[], suppliers:[], purchases:[], issues:[], returns:[],
  production:[], consumption:[], wastage:[], costs:[], gas:[], cleaning:[], equipment:[], vessels:[],
  tasks:[], attendance:[], audit:[]
});
let S=JSON.parse(localStorage.getItem(KEY)||"null")||defaultState();
S.reminders=S.reminders||[];
S.duties=S.duties||[];
S.notifications=S.notifications||[];
S.planDeductions=S.planDeductions||[];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function checkReminders(){
 const nowD=new Date(); const todayMs=new Date(S.date+"T00:00:00").getTime();
 S.reminders.forEach(r=>{
   if(!r.date||r.done) return;
   const diff=Math.ceil((new Date(r.date+"T00:00:00").getTime()-todayMs)/86400000);
   if(diff<=Number(r.daysBefore||0)){
     const key=r.id+"-"+S.date;
     if(!S.notifications.some(n=>n.key===key)){
       S.notifications.unshift({id:uid(),key,text:`🔔 ${r.title} — ${diff>0?diff+" ദിവസം ബാക്കി":"ഇന്ന്"}`,date:S.date,at:now(),target:r.target||"Admin"});
       if("Notification" in window && Notification.permission==="granted"){
         try{new Notification("Kitchen Service Pro",{body:`${r.title} — ${diff>0?diff+" ദിവസം ബാക്കി":"ഇന്ന്"}`})}catch(e){}
       }
     }
   }
 });
 S.notifications=S.notifications.slice(0,100);
 save();
}
async function enableNotifications(){
 if(!("Notification" in window)) return alert("ഈ browser notification support ചെയ്യുന്നില്ല.");
 const p=await Notification.requestPermission();
 alert(p==="granted"?"Notifications ON ആയി.":"Notification permission അനുവദിച്ചില്ല.");
}

function log(action,detail=""){S.audit.unshift({id:uid(),at:now(),user:S.user?.name||"System",action,detail});S.audit=S.audit.slice(0,500);save()}
function seed(){
 if(S.members.length||S.rawMaterials.length||S.suppliers.length||S.recipes.length) return;
 S.members=[
  {id:uid(),name:"Kitchen Supervisor",emp:"K001",phone:"",place:"",dept:"Kitchen"},
  {id:uid(),name:"Store Staff",emp:"S001",phone:"",place:"",dept:"Store"}
 ];
 S.suppliers=[{id:uid(),name:"Main Supplier",phone:"",item:"Rice"}];
 S.rawMaterials=[
  {id:uid(),name:"Rice",unit:"kg",qty:1000,min:200,rate:55,expiry:""},
  {id:uid(),name:"Dal",unit:"kg",qty:300,min:60,rate:120,expiry:""},
  {id:uid(),name:"Vegetable",unit:"kg",qty:500,min:100,rate:45,expiry:""},
  {id:uid(),name:"Oil",unit:"L",qty:250,min:50,rate:150,expiry:""}
 ];
 S.recipes=[
  {id:uid(),name:"Rice Meal",meal:"Lunch",servings:1,ings:[{name:"Rice",qty:.18,unit:"kg"},{name:"Oil",qty:.01,unit:"L"}]},
  {id:uid(),name:"Dal Curry",meal:"Lunch",servings:1,ings:[{name:"Dal",qty:.04,unit:"kg"}]}
 ];
 save();
}
seed();
checkStockAlerts();

const tabs=[
 ["dash","Dashboard"],["people","Staff"],["att","Attendance"],["meals","Meal Count"],["menu","Menu"],
 ["calc","Calculation"],["recipe","Recipes"],["stock","Stock"],["purchase","Purchase"],["issue","Issue/Return"],
 ["prod","Production"],["consume","Consumption"],["waste","Wastage"],["cost","Food Cost"],["gas","Gas"],
 ["clean","Cleaning"],["equip","Equipment"],["vessel","Vessels"],["tasks","Tasks"],["duty","Duty & Schedule"],["remind","Reminders"],["reports","Reports"],["admin","Admin"]
];
function app(){
 if(!S.user){$("#app").innerHTML=login();return}
 $("#app").innerHTML=`<header class="top"><div class="toprow"><div class="brand">🍲 KITCHEN SERVICE PRO</div><div class="small">${esc(S.user.name)} · ${esc(S.user.role)}</div><button class="btn secondary" onclick="logout()">Logout</button></div></header>
 <main class="wrap"><div class="nav"><button class="${(S.tab||"dash")=="dash"?"active":""}" onclick="go('dash')">Home</button><button class="${["meals","menu","calc","recipe","prod","consume","waste","cost"].includes(S.tab)?"active":""}" onclick="go('meals')">Kitchen</button><button class="${["stock","purchase","issue"].includes(S.tab)?"active":""}" onclick="go('stock')">Store</button><button class="${["people","att"].includes(S.tab)?"active":""}" onclick="go('people')">Staff</button><button class="${S.tab=="reports"?"active":""}" onclick="go('reports')">Reports</button></div><div id="view"></div></main><div id="moreMenu" class="moremenu hidden">${tabs.filter(t=>!["dash","meals","stock","people","reports"].includes(t[0])).map(t=>`<button class="${S.tab==t[0]?"active":""}" onclick="go('${t[0]}');toggleMore(false)">${t[1]}</button>`).join("")}<button onclick="go('admin');toggleMore(false)">⚙️ Admin</button></div><div class="bottom"><button class="${S.tab=="dash"?"active":""}" onclick="go('dash')"><b>⌂</b>Home</button><button class="${["meals","menu","calc","recipe","prod","consume","waste","cost"].includes(S.tab)?"active":""}" onclick="go('meals')"><b>🍲</b>Kitchen</button><button class="${["stock","purchase","issue"].includes(S.tab)?"active":""}" onclick="go('stock')"><b>📦</b>Store</button><button class="${["people","att"].includes(S.tab)?"active":""}" onclick="go('people')"><b>👥</b>Staff</button><button class="${["reports","admin","gas","clean","equip","vessel","tasks"].includes(S.tab)?"active":""}" onclick="toggleMore()"><b>☰</b>More</button></div>`;
 render();
}
function login(){return `<div class="login"><div class="loginbox"><div class="logo">🍲</div><h2>Kitchen Service Pro</h2><p class="muted">50,000 ആളുകൾക്കുള്ള Central Kitchen Management</p><div class="field"><label>User</label><select id="loginUser"><option>Admin</option><option>Manager</option><option>Supervisor</option><option>Staff</option></select></div><div class="field" style="margin-top:9px"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"></div><button class="btn" style="width:100%;margin-top:12px" onclick="doLogin()">Login</button><p class="muted" style="margin-top:12px">Default PIN: Admin 1234 · Manager 2222 · Supervisor 3333 · Staff 4444</p><div class="alert" style="margin-top:12px">📱 Login ചെയ്ത ശേഷം Chrome menu → <b>Add to Home screen / Install app</b> തിരഞ്ഞെടുക്കാം.</div></div></div>`}
function doLogin(){let r=$("#loginUser").value,p=$("#loginPin").value,ok={Admin:"1234",Manager:"2222",Supervisor:"3333",Staff:"4444"}[r];if(p!==ok)return alert("PIN ശരിയല്ല");S.user={name:r,role:r};S.tab="dash";log("Login");app()}
function logout(){log("Logout");S.user=null;save();app()}
function go(t){S.tab=t;save();render();scrollTo(0,0)}
function canEdit(){return ["Admin","Manager"].includes(S.user.role)}
function toggleMore(force){let m=$("#moreMenu");if(!m)return;let show=force===undefined?m.classList.contains("hidden"):force;m.classList.toggle("hidden",!show)}
function render(){let v=$("#view");if(!v)return;v.innerHTML=(window["page_"+(S.tab||"dash")]||page_dash)();}

function page_dash(){
 const d=S.date,m=S.meals[d]||{breakfast:S.settings.capacity,lunch:S.settings.capacity,dinner:S.settings.capacity};
 const present=S.attendance.filter(x=>x.date===d&&x.in).length;
 const low=S.rawMaterials.filter(x=>Number(x.qty)<=Number(x.min)).length;
 const wast=S.wastage.filter(x=>x.date===d).reduce((a,x)=>a+Number(x.qty||0),0);
 const cost=S.costs.filter(x=>x.date===d).reduce((a,x)=>a+Number(x.amount||0),0);
 return `<h2>Dashboard</h2><div class="card"><div class="form"><div class="field"><label>Working Date</label><input type="date" value="${d}" onchange="S.date=this.value;save();render()"></div><div><div class="muted">Total Meal Count</div><div class="kpi">${(Number(m.breakfast)||0)+(Number(m.lunch)||0)+(Number(m.dinner)||0)}</div></div></div></div>
 <div class="grid"><div class="card"><div class="muted">Staff Present</div><div class="kpi">${present}</div></div><div class="card"><div class="muted">Low Stock</div><div class="kpi ${low?'bad':''}">${low}</div></div><div class="card"><div class="muted">Today's Waste</div><div class="kpi">${wast}</div></div><div class="card"><div class="muted">Today's Other Cost</div><div class="kpi">${money(cost)}</div></div></div>
 <div class="card"><h3>Workflow</h3><div class="muted">Calculation → Stock → Purchase → Production → Consumption → Wastage → Cost → Reports</div></div>
 <div class="grid"><div class="card"><div class="muted">Upcoming Reminders</div><div class="kpi">${S.reminders.filter(r=>!r.done&&r.date>=S.date).length}</div></div><div class="card"><div class="muted">Today's Duties</div><div class="kpi">${S.duties.filter(x=>x.date===S.date).length}</div></div></div>
 ${S.notifications.length?`<div class="alert">🔔 ${esc(S.notifications[0].text)}</div>`:""}
 ${low?`<div class="alert">⚠️ ${low} stock item(s) are at/below minimum.</div>`:""}<div class="sectiontitle">Quick Actions</div><div class="quick"><button onclick="go('meals')">🍽️ Meal Count<span>Breakfast / Lunch / Dinner</span></button><button onclick="go('calc')">🧮 Calculation<span>Ingredient requirement</span></button><button onclick="go('stock')">📦 Stock<span>Check store balance</span></button><button onclick="go('purchase')">🛒 Purchase<span>Receive stock</span></button><button onclick="go('prod')">👨‍🍳 Production<span>Daily production</span></button><button onclick="go('waste')">🗑️ Wastage<span>Record waste</span></button></div>`;
}

function page_people(){
 return `<h2>Staff & Department</h2>${canEdit()?`<div class="card"><h3>Add Staff</h3><div class="form">
 <div class="field"><label>Name</label><input id="pn" placeholder="Name"></div><div class="field"><label>Employee ID</label><input id="pe" placeholder="K001"></div><div class="field"><label>Phone</label><input id="pp"></div><div class="field"><label>Place</label><input id="pl"></div><div class="field"><label>Department</label><select id="pd">${S.departments.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div></div><div class="actions"><button class="btn" onclick="addPerson()">Add</button></div></div>`:""}<div class="card"><div class="muted">Maximum attendance staff: 300</div><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Name</th><th>Phone</th><th>Place</th><th>Department</th><th></th></tr>${S.members.map(x=>`<tr><td>${esc(x.emp)}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.place)}</td><td>${esc(x.dept)}</td><td>${canEdit()?`<button class="btn danger" onclick="delPerson('${x.id}')">Delete</button>`:""}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No staff</td></tr>`}</table></div></div>`;
}
function addPerson(){if(S.members.length>=300)return alert("300 staff limit");S.members.push({id:uid(),name:pn.value,emp:pe.value,phone:pp.value,place:pl.value,dept:pd.value});log("Staff added",pe.value);save();render()}
function delPerson(id){if(!confirm("Delete this staff?"))return;S.members=S.members.filter(x=>x.id!==id);log("Staff deleted",id);save();render()}

function page_att(){
 let rows=S.members.map(m=>{let a=S.attendance.find(x=>x.date===S.date&&x.memberId===m.id);return `<tr><td>${esc(m.emp)}</td><td>${esc(m.name)}</td><td>${esc(m.dept)}</td><td>${a?.in||"-"}</td><td>${a?.out||"-"}</td><td>${a?.in&&a?.out?hours(a.in,a.out):"-"}</td><td><button class="btn" onclick="punch('${m.id}','in')">IN</button> <button class="btn secondary" ${a?.in?"":"disabled"} onclick="punch('${m.id}','out')">OUT</button></td></tr>`}).join("");
 return `<h2>Attendance</h2><div class="card"><div class="form"><div class="field"><label>Date</label><input type="date" value="${S.date}" onchange="S.date=this.value;save();render()"></div><div><div class="muted">Staff</div><div class="kpi">${S.members.length}/300</div></div><div><div class="muted">Present</div><div class="kpi">${S.attendance.filter(x=>x.date===S.date&&x.in).length}</div></div></div></div><div class="card"><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Name</th><th>Dept</th><th>IN</th><th>OUT</th><th>Hours</th><th>Action</th></tr>${rows}</table></div></div>`;
}
function hours(i,o){let a=i.split(":").map(Number),b=o.split(":").map(Number);let n=(b[0]*60+b[1])-(a[0]*60+a[1]);if(n<0)n+=1440;return (n/60).toFixed(2)+" h"}
function punch(mid,type){let a=S.attendance.find(x=>x.date===S.date&&x.memberId===mid);if(!a){a={id:uid(),date:S.date,memberId:mid,in:"",out:""};S.attendance.push(a)}if(type==="out"&&!a.in)return alert("ആദ്യം IN mark ചെയ്യണം");a[type]=timeNow();log(type==="in"?"Attendance IN":"Attendance OUT",mid);save();render()}

function page_meals(){
 let m=S.meals[S.date]||{breakfast:0,lunch:0,dinner:0};
 return `<h2>Meal Count</h2><div class="card"><div class="form"><div class="field"><label>Date</label><input type="date" value="${S.date}" onchange="S.date=this.value;save();render()"></div><div class="field"><label>Breakfast</label><input id="mb" type="number" value="${m.breakfast}"></div><div class="field"><label>Lunch</label><input id="ml" type="number" value="${m.lunch}"></div><div class="field"><label>Dinner</label><input id="md" type="number" value="${m.dinner}"></div></div><div class="actions"><button class="btn" onclick="saveMeals()">Save Meal Count</button></div></div>`;
}
function saveMeals(){S.meals[S.date]={breakfast:+mb.value||0,lunch:+ml.value||0,dinner:+md.value||0};log("Meal count saved",S.date);save();render()}

function page_menu(){
 return `<h2>Menu Management</h2><div class="card">${canEdit()?`<div class="form"><div class="field"><label>Date</label><input id="mdate" type="date" value="${S.date}"></div><div class="field"><label>Meal</label><select id="mmeal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select></div><div class="field"><label>Menu</label><input id="mname" placeholder="Rice, Curry..."></div></div><div class="actions"><button class="btn" onclick="addMenu()">Add</button></div>`:""}<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Meal</th><th>Menu</th><th></th></tr>${S.menu.map(x=>`<tr><td>${x.date}</td><td>${esc(x.meal)}</td><td>${esc(x.name)}</td><td>${canEdit()?`<button class="btn danger" onclick="S.menu=S.menu.filter(a=>a.id!=='${x.id}');save();render()">Delete</button>`:""}</td></tr>`).join("")}</table></div></div>`;
}
function addMenu(){S.menu.push({id:uid(),date:mdate.value,meal:mmeal.value,name:mname.value});log("Menu added",mname.value);save();render()}

function unitBase(q,u){u=String(u||"").toLowerCase();q=Number(q||0);if(u==="g"||u==="gram"||u==="grams")return {q:q/1000,u:"kg"};if(u==="ml"||u==="millilitre"||u==="milliliter")return {q:q/1000,u:"L"};return {q,u:u||""}}
function fmtQty(q,u){q=Number(q||0);u=String(u||"");if(!q)return "0 "+u;return (Math.abs(q-Math.round(q))<1e-9?Math.round(q):q.toFixed(3).replace(/0+$/,'').replace(/\.$/,''))+" "+u}
function getPlan(date){let agg={};let rows=S.menu.filter(m=>m.date===date);rows.forEach(m=>{let people=Number((S.meals[date]||{})[String(m.meal||"").toLowerCase()]||0);let r=S.recipes.find(r=>r.name.toLowerCase()===String(m.name||"").toLowerCase());if(!r||!people)return;r.ings.forEach(i=>{let b=unitBase(Number(i.qty)*people,i.unit);let k=i.name.trim().toLowerCase()+"|"+b.u;if(!agg[k])agg[k]={name:i.name.trim(),qty:0,unit:b.u};agg[k].qty+=b.q})});return {items:Object.values(agg)}}
function deductMealStock(meal){let people=Number((S.meals[S.date]||{})[meal.toLowerCase()]||0);if(!people)return alert("ഈ meal-ന്റെ people count നൽകണം");let key=S.date+"|"+meal;if(S.planDeductions.some(x=>x.key===key))return alert("ഈ meal-ന്റെ stock ഇതിനകം deduct ചെയ്തിട്ടുണ്ട്.");let menu=S.menu.filter(m=>m.date===S.date&&m.meal===meal);if(!menu.length)return alert("ഈ meal-ന് menu set ചെയ്തിട്ടില്ല.");let agg={};menu.forEach(m=>{let r=S.recipes.find(r=>r.name.toLowerCase()===String(m.name).toLowerCase());if(!r)return;r.ings.forEach(i=>{let b=unitBase(Number(i.qty)*people,i.unit);let k=i.name.trim().toLowerCase()+"|"+b.u;if(!agg[k])agg[k]={name:i.name.trim(),qty:0,unit:b.u};agg[k].qty+=b.q})});let shortages=[];Object.values(agg).forEach(x=>{let st=S.rawMaterials.find(a=>a.name.toLowerCase()===x.name.toLowerCase());if(!st)shortages.push(x.name+" stock item ഇല്ല");else{let have=Number(st.qty||0);let base=unitBase(have,st.unit);if(base.u!==x.unit){shortages.push(x.name+" unit mismatch");}else if(base.q<x.qty){shortages.push(x.name+" shortage: "+fmtQty(x.qty-base.q,x.unit));}}});if(shortages.length)return alert("Stock മതിയാകില്ല:\n\n"+shortages.join("\n"));Object.values(agg).forEach(x=>{let st=S.rawMaterials.find(a=>a.name.toLowerCase()===x.name.toLowerCase());let b=unitBase(Number(st.qty||0),st.unit);st.qty=Math.max(0,b.q-x.qty);});S.planDeductions.unshift({id:uid(),key,date:S.date,meal,people,at:now(),items:Object.values(agg)});S.production.unshift({id:uid(),date:S.date,item:meal+" production",qty:people,people,at:now(),autoStock:true});log("Food production - stock deducted",meal+" / "+people);save();checkStockAlerts();render()}
function checkStockAlerts(){let lows=S.rawMaterials.filter(x=>Number(x.qty)<=Number(x.min));if(lows.length){lows.slice(0,10).forEach(x=>{let key="stock-"+x.id+"-"+S.date;if(!S.notifications.some(n=>n.key===key)){S.notifications.unshift({id:uid(),key,text:`📦 Stock Low: ${x.name} — ${fmtQty(x.qty,x.unit)} (Min ${fmtQty(x.min,x.unit)})`,date:S.date,at:now(),target:"Admin"})}});S.notifications=S.notifications.slice(0,100);save()}}

function page_calc(){
 let meals=S.meals[S.date]||{breakfast:0,lunch:0,dinner:0};
 let plan=getPlan(S.date);
 let rows=plan.items.map(x=>{let st=S.rawMaterials.find(a=>a.name.toLowerCase()===x.name.toLowerCase());let have=st?Number(st.qty):0;let req=x.qty;let shortage=Math.max(0,req-have);let unit=x.unit||st?.unit||"";return `<tr><td>${esc(x.name)}</td><td>${fmtQty(req,unit)}</td><td>${esc(unit)}</td><td>${fmtQty(have,st?.unit||unit)}</td><td>${shortage?`<span class="bad">SHORT ${fmtQty(shortage,unit)}</span>`:`<span class="good">OK</span>`}</td><td>${shortage?`<span class="warn">Buy ${fmtQty(shortage,unit)}</span>`:"-"}</td></tr>`}).join("");
 return `<h2>Food Calculation</h2>
 <div class="card"><div class="form"><div class="field"><label>Date</label><input type="date" value="${S.date}" onchange="S.date=this.value;save();render()"></div><div><div class="muted">Breakfast</div><div class="kpi">${meals.breakfast||0}</div></div><div><div class="muted">Lunch</div><div class="kpi">${meals.lunch||0}</div></div><div><div class="muted">Dinner</div><div class="kpi">${meals.dinner||0}</div></div></div>
 <p class="muted"><b>Recipe × meal people</b> ആണ് calculation. Menu-ൽ ചേർത്ത recipes മാത്രം ഈ ദിവസത്തേക്ക് കണക്കാക്കും.</p>
 <div class="actions"><button class="btn" onclick="render()">🔄 Recalculate</button><button class="btn secondary" onclick="go('menu')">🍽️ Set Menu</button><button class="btn secondary" onclick="go('meals')">👥 Set People</button></div></div>
 <div class="card"><h3>Required Ingredients</h3><div class="tablewrap"><table class="table"><tr><th>Ingredient</th><th>Required</th><th>Unit</th><th>Current Stock</th><th>Status</th><th>Purchase</th></tr>${rows||`<tr><td colspan="6" class="empty">ഈ തീയതിക്ക് Menu/Recipe set ചെയ്തിട്ടില്ല.</td></tr>`}</table></div></div>
 <div class="card"><h3>🍲 Production & Stock</h3><p class="muted">Food production save ചെയ്യുമ്പോൾ ഈ day's planned ingredients stock-ൽ നിന്ന് ഒരിക്കൽ മാത്രം automatically കുറയ്ക്കാം.</p>${["Breakfast","Lunch","Dinner"].map(meal=>{let people=Number(meals[meal.toLowerCase()]||0);let key=S.date+"|"+meal;let done=S.planDeductions.some(x=>x.key===key);let has=S.menu.some(m=>m.date===S.date&&m.meal===meal);return `<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${meal}</b> · ${people} people · ${has?"Menu set":"No menu"} · ${done?"<span class=\"good\">Stock deducted ✓</span>":"<span class=\"warn\">Not deducted</span>"} ${has&&!done&&canEdit()?`<button class="btn" style="float:right" onclick="deductMealStock('${meal}')">Produce & Deduct Stock</button>`:""}</div>`}).join("")}</div>`;
}

function page_admin(){
 return `<h2>Admin / Backup</h2><div class="card"><h3>System</h3><p class="muted">This version stores data securely in this browser using local storage. Use backup regularly.</p><div class="actions"><button class="btn" onclick="backup()">Backup JSON</button><button class="btn secondary" onclick="document.getElementById('restore').click()">Restore JSON</button><input id="restore" class="hidden" type="file" accept=".json" onchange="restore(this)"></div></div><div class="card"><h3>Activity History</h3><div class="tablewrap"><table class="table"><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr>${S.audit.slice(0,100).map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join("")}</table></div></div><div class="card"><h3>Danger Zone</h3><button class="btn danger" onclick="resetAll()">Delete all app data</button></div>`;
}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="kitchen-service-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href)}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!confirm("Restore this backup? Current data will be replaced."))return;S=x;S.user={name:"Admin",role:"Admin"};save();alert("Restored");app()}catch(e){alert("Backup file invalid")}};r.readAsText(f)}
function resetAll(){if(!confirm("എല്ലാ app data-യും delete ചെയ്യണോ?"))return;localStorage.removeItem(KEY);location.reload()}
